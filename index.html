  <style id="newspaper-css">
    * { margin: 0; padding: 0; box-sizing: border-box; }

<body>
<div class="editor-container">
  <div class="controls">
    <h2>🖋️ Editor – La Mia Ezine</h2>
    <div class="status" id="saveStatus">✅ Modifiche automaticamente salvate</div>
    <div class="status" id="editModeStatus" style="background:#e9e2cf; display:none;">✏️ Modalità modifica attiva</div>

    <div class="control-group">
      <h3>📅 Dati di testata</h3>
      <label>Anno</label><input type="text" id="anno" value="I">
      <label>Numero</label><input type="text" id="numero" value="0">
      <label>Data</label><input type="text" id="data" value="">
      <label>Colore "Underground"</label><input type="color" id="titleColor" value="#8b1f1f">
    </div>

    <div class="control-group">
      <h3>📚 Archivio e Salvataggio</h3>
      <label>Titolo uscita (per salvare)</label><input type="text" id="issueTitle" placeholder="Es. Numero 1 - Giugno 2026">
      <button id="saveIssueBtn">💾 Salva nuova uscita</button>
      <button id="updateIssueBtn" style="display:none;">🔄 Aggiorna uscita corrente</button>
      <button id="archiveBtn">📂 Apri archivio</button>
      <div style="font-size:0.7rem; margin-top:5px;">Le uscite vengono salvate in database SQLite e consultabili nell'archivio.</div>
    </div>

    <div class="control-group">
      <h3>➕ Aggiungi / Modifica contenuto</h3>
      <select id="targetSection">
        <option value="fullWidth">Articolo FULL-WIDTH (sopra colonne)</option>
        <option value="colLeft">Prima pagina - SINISTRA</option>
        <option value="colRight">Prima pagina - DESTRA</option>
        <option value="straight">Straight from the Man</option>
        <option value="roundup">Roundup (nuova voce)</option>
        <option value="letters">Lettere (nuova voce)</option>
        <option value="fight">Fight the Power (nuova voce)</option>
        <option value="fakeAd">Consiglio (con sfondo)</option>
        <option value="nextIssue">Anticipazione (footer)</option>
        <option value="rubric">Rubrica fissa (footer)</option>
      </select>
      <label>Titolo (o intestazione)</label><input type="text" id="newTitle" placeholder="Titolo articolo">
      
      <!-- CAMPI FULL-WIDTH -->
      <div id="fullwidthExtra" class="fullwidth-extra">
        <label>Dimensione titolo (full-width)</label>
        <select id="fwTitleSize">
          <option value="2rem">2rem (normale)</option><option value="2.5rem">2.5rem (medio)</option>
          <option value="3rem">3rem (grande)</option><option value="3.5rem">3.5rem (extra grande)</option>
          <option value="4rem">4rem (molto grande)</option><option value="4.5rem">4.5rem (enorme)</option>
          <option value="5rem">5rem (gigante)</option><option value="5.5rem">5.5rem (extra gigante)</option>
          <option value="6rem">6rem (maxi)</option>
        </select>
        <label>Allineamento titolo</label>
        <select id="fwTitleAlign">
          <option value="left">Sinistra</option><option value="center">Centrato</option><option value="right">Destra</option>
        </select>
        <label>Allineamento testo</label>
        <select id="fwTextAlign">
          <option value="justify">Giustificato (giornale)</option><option value="left">Sinistra (normale)</option>
        </select>
        <label>Numero colonne per il corpo</label>
        <select id="fwColumns">
          <option value="1">1 colonna (normale)</option>
          <option value="2">2 colonne</option>
          <option value="3">3 colonne</option>
        </select>
      </div>
      
      <label>Testo</label><textarea id="newText" rows="3" placeholder="Contenuto..."></textarea>
      <label>Scegli icona/kicker (opzionale)</label>
      <select id="kickerSelect">
        <option value="">-- Nessuna --</option>
        <option value="🔍 ESCLUSIVO">🔍 ESCLUSIVO</option>
        <option value="🛸 CONTROLLO MENTALE">🛸 CONTROLLO MENTALE</option>
        <option value="⚔️ GUERRA PSICHICA">⚔️ GUERRA PSICHICA</option>
        <option value="💻 TECNO-DENUNCIA">💻 TECNO-DENUNCIA</option>
        <option value="🌍 AMBIENTE IN PERICOLO">🌍 AMBIENTE IN PERICOLO</option>
        <option value="🏥 SALUTE PUBBLICA">🏥 SALUTE PUBBLICA</option>
        <option value="📢 DENUNCIA">📢 DENUNCIA</option>
        <option value="✊ AZIONE DIRETTA">✊ AZIONE DIRETTA</option>
        <option value="🎭 SATIRA">🎭 SATIRA</option>
        <option value="🔎 MISTERO">🔎 MISTERO</option>
        <option value="📡 ONDE PIRATA">📡 ONDE PIRATA</option>
        <option value="📻 SPETTRO RADIO">📻 SPETTRO RADIO</option>
      </select>
      <label>Kicker personalizzato</label><input type="text" id="newKicker" placeholder="Es. 🔥 FALSO ALLARME">
      <label>Byline</label><input type="text" id="newByline">
      <label>URL immagine (opzionale)</label><input type="text" id="newImage" placeholder="https://... .jpg">
      <label>Allineamento orizzontale immagine</label>
      <select id="imageFloat">
        <option value="none">Nessuno (centrato)</option>
        <option value="left">A sinistra (testo a fianco)</option>
        <option value="right">A destra (testo a fianco)</option>
      </select>
      <label>Posizione verticale</label>
      <select id="imagePosition">
        <option value="top">In cima (tra titolo e testo)</option>
        <option value="middle">In mezzo (dentro il testo)</option>
        <option value="bottom">In basso (dopo il testo)</option>
      </select>
      <label>Didascalia (opzionale)</label><input type="text" id="imageCaption" placeholder="Es. Foto: manifestazione">
      <label>Stile immagine</label>
      <select id="imageStyle">
        <option value="normal">Normale</option>
        <option value="woodcut">Xilografia</option>
        <option value="bitmap">Bitmap rumorosa</option>
      </select>
      
      <!-- Sezione checkbox per sfondo colorato: visibile solo se la sezione corrente è fakeAd -->
      <div id="fakeadExtra" class="fakead-extra">
        <div class="checkbox-inline">
          <input type="checkbox" id="coloredBg">
          <label>Sfondo colorato (fake-ad style)</label>
        </div>
      </div>

      <div>
        <button id="addContentBtn">➕ Aggiungi / Aggiorna</button>
        <button id="cancelEditBtn" class="secondary" style="display:none;">❌ Annulla modifica</button>
      </div>
    </div>

    <div class="control-group">
      <h3>🗂️ Gestione sezioni</h3>
      <button id="resetAllBtn" class="secondary">⟳ Resetta TUTTO</button>
      <button id="printBtn" class="secondary">🖨️ Stampa / PDF</button>
      <button id="exportBtn" class="secondary">💾 Esporta HTML</button>
    </div>
  </div>

  <div class="preview">
    <div id="newspaperPreview" class="newspaper"></div>
  </div>
</div>

<script>
  let newspaperData = {
    header: { anno: "I", numero: "0", data: "", titleColor: "#8b1f1f" },
    fullWidth: null,
    colLeft: [],
    colRight: [],
    straightFromTheMan: { text: "<strong>Ignazio “Naz” Marra</strong> – La tua playlist non ti appartiene. Se ti ritrovi a canticchiare tormentoni prodotti in serie da algoritmi svedesi, potresti essere bersaglio di un attacco armonico indotto. Smettetela di ballare, ragazzi. Iniziate a dubitare." },
    roundup: [],
    letters: [],
    fight: [],
    fakeAd: { text: "⚠️ CONSIGLIO DELL’OSSERVATORE: guardate solo programmi con rating IMDb sotto 5.0 – proteggete i vostri occhi e la vostra sanità mentale.", enabled: true, colored: false },
    nextIssue: "Le miniere di litio in Sardegna e il patto segreto con le EV car",
    fixedRubric: "“Unravel the Mystery” – Il triangolo delle Bermuda spiegato (non come pensi)"
  };
  let editing = { active: false, section: null, index: null };
  let currentIssueId = null;

  function getCurrentItalianDate() {
    const d = new Date();
    const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
    let formatted = d.toLocaleDateString('it-IT', options);
    return formatted.charAt(0).toUpperCase() + formatted.slice(1);
  }

  function initExampleData() {
    newspaperData.fullWidth = { 
      type: "article", title: "SPECIALE: L'EDITOR ORA SUPPORTA ARTICOLI FULL-WIDTH", 
      text: "Questa è una dimostrazione di un articolo che occupa l'intera larghezza della pagina, ideale per notizie di prima plana o editoriali. Puoi aggiungerlo, modificarlo o eliminarlo usando i pulsanti sottostanti. Il testo può essere suddiviso in più colonne, come nei veri giornali. Prova a selezionare 2 o 3 colonne dal pannello di controllo. Le immagini possono essere posizionate sopra, dentro o sotto le colonne, e il titolo rimane a tutta larghezza.", 
      kicker: "🔥 IN PRIMO PIANO", byline: "Redazione", image: "", imageFloat: "none", 
      imagePosition: "top", imageCaption: "", imageStyle: "normal",
      fwTitleSize: "3rem", fwTitleAlign: "center", fwTextAlign: "justify", fwColumns: "2"
    };
    newspaperData.colLeft = [
      { type: "article", title: "I tuoi dati nel WC dell'aeroporto?", text: "Nuove prove suggeriscono che i bagni pubblici degli aeroporti internazionali siano dotati di aspiratori silenziosi per il campionamento del DNA. Un ex tecnico TSA ha rivelato l’esistenza del programma “Project Soggy Swab”.", kicker: "🔍 ESCLUSIVO", byline: "Redazione Osservatore", image: "", imageFloat: "none", imagePosition: "top", imageCaption: "", imageStyle: "normal" },
      { type: "article", title: "MORTE PER BALLOTTAGGIO", text: "Un candidato sindaco a Bogotà è stato trascinato per 3 km dietro un carro dei rifiuti dopo aver promesso “trasparenza nei contratti dei rifiuti”.", kicker: "", byline: "dalla nostra inviata", image: "", imageFloat: "none", imagePosition: "top", imageCaption: "", imageStyle: "normal" }
    ];
    newspaperData.colRight = [
      { type: "article", title: "Allarme: serie TV “di qualità” causano strabismo", text: "I nostri Alpha-scanner hanno rilevato array di particelle subliminali nei segnali 4K di produzioni come Severance e The White Lotus.", kicker: "🛸 CONTROLLO MENTALE", byline: "", image: "", imageFloat: "none", imagePosition: "top", imageCaption: "", imageStyle: "normal" },
      { type: "article", title: "ALLARME MUCCHE PAZZE", text: "L’Europa ci attacca con la malattia della mucca pazza? Un allevatore dell’Iowa accusa la Francia.", kicker: "", byline: "", image: "", imageFloat: "none", imagePosition: "top", imageCaption: "", imageStyle: "normal" }
    ];
    newspaperData.roundup = [
      { text: "<strong>CLONAZIONE ALIENA</strong> – Embrioni ibridi in Nebraska." },
      { text: "<strong>GUERRA PSICHICA</strong> – Bounty hunter psichici per giornalisti." }
    ];
    newspaperData.letters = [
      { text: "<em>“Ho scollegato l’antenna dopo il vostro articolo sul 5G”</em> – Lettore di Catanzaro" }
    ];
    newspaperData.fight = [
      { text: "Distribuisci questo PDF, stampalo e appendilo nei luoghi di ritrovo." }
    ];
    newspaperData.fakeAd = { text: "⚠️ CONSIGLIO: guardate solo programmi con rating IMDb sotto 5.0", enabled: true, colored: false };
    newspaperData.nextIssue = "Le miniere di litio in Sardegna e il patto segreto con le EV car";
    newspaperData.fixedRubric = "“Unravel the Mystery” – Il triangolo delle Bermuda";
  }

  function saveAndRender() {
    newspaperData.header.anno = document.getElementById('anno').value;
    newspaperData.header.numero = document.getElementById('numero').value;
    newspaperData.header.data = document.getElementById('data').value;
    newspaperData.header.titleColor = document.getElementById('titleColor').value;
    localStorage.setItem('undergroundObserver', JSON.stringify(newspaperData));
    renderNewspaper(false);
    document.getElementById('saveStatus').innerText = '✅ Salvato ' + new Date().toLocaleTimeString();
  }

  function getImageClass(style) {
    if (style === 'woodcut') return 'img-woodcut';
    if (style === 'bitmap') return 'img-bitmap';
    return '';
  }

  function renderImageBlock(art) {
    if (!art.image) return '';
    const imgClass = getImageClass(art.imageStyle);
    const floatClass = (art.imageFloat === 'left' || art.imageFloat === 'right') ? `float-${art.imageFloat}` : '';
    const captionHtml = art.imageCaption ? `<div class="caption">${art.imageCaption}</div>` : '';
    return `<div class="image-wrapper ${floatClass}"><img class="article-img ${imgClass}" src="${art.image}" alt="illustrazione">${captionHtml}</div>`;
  }

  function insertImageInline(text, imgBlock) {
    if (!imgBlock) return text;
    const mid = Math.floor(text.length / 2);
    let pos = text.lastIndexOf(' ', mid);
    if (pos === -1) pos = mid;
    return text.slice(0, pos) + ' ' + imgBlock + ' ' + text.slice(pos);
  }

  function renderArticleContent(art, isFullWidth = false) {
    if (!art) return '';
    let html = '';
    if (art.kicker) html += `<div class="kicker">${art.kicker}</div>`;
    if (art.title) {
      if (isFullWidth && art.fwTitleSize) {
        html += `<h2 style="font-size: ${art.fwTitleSize}; text-align: ${art.fwTitleAlign || 'center'}; border-left: none; padding-left: 0;">${art.title}</h2>`;
      } else {
        html += `<h2>${art.title}</h2>`;
      }
    }
    if (art.byline) html += `<div class="byline">${art.byline}</div>`;
    
    const imgBlock = renderImageBlock(art);
    const pos = art.imagePosition || 'top';
    const isFloated = (art.imageFloat === 'left' || art.imageFloat === 'right');
    const textAlignStyle = (isFullWidth && art.fwTextAlign) ? `style="text-align: ${art.fwTextAlign};"` : '';
    
    if (isFullWidth && art.fwColumns && art.fwColumns !== '1') {
      const columnCount = art.fwColumns;
      if (pos === 'top') {
        if (imgBlock) html += imgBlock;
        html += `<div class="fullwidth-columns" style="column-count: ${columnCount};">${art.text.replace(/\n/g, '<br>')}</div>`;
      } else if (pos === 'bottom') {
        html += `<div class="fullwidth-columns" style="column-count: ${columnCount};">${art.text.replace(/\n/g, '<br>')}</div>`;
        if (imgBlock) html += imgBlock;
      } else { // middle
        if (imgBlock) {
          const textWithImage = insertImageInline(art.text, imgBlock);
          html += `<div class="fullwidth-columns" style="column-count: ${columnCount};">${textWithImage.replace(/\n/g, '<br>')}</div>`;
        } else {
          html += `<div class="fullwidth-columns" style="column-count: ${columnCount};">${art.text.replace(/\n/g, '<br>')}</div>`;
        }
      }
    } else {
      if (pos === 'top') {
        if (imgBlock) html += imgBlock;
        html += `<p ${textAlignStyle}>${art.text}</p>`;
      } else if (pos === 'bottom') {
        html += `<p ${textAlignStyle}>${art.text}</p>`;
        if (imgBlock) html += imgBlock;
      } else { // middle
        if (imgBlock) {
          if (isFloated) {
            const textWithImage = insertImageInline(art.text, imgBlock);
            html += `<p ${textAlignStyle}>${textWithImage}</p>`;
          } else {
            const parts = art.text.split(/\n\s*\n/);
            if (parts.length > 1) {
              parts.splice(1, 0, imgBlock);
              html += `<p ${textAlignStyle}>${parts.join('</p><p ' + textAlignStyle + '>')}</p>`;
            } else {
              const mid = Math.floor(art.text.length / 2);
              let pos = art.text.lastIndexOf(' ', mid);
              if (pos === -1) pos = mid;
              html += `<p ${textAlignStyle}>${art.text.slice(0, pos)}</p>${imgBlock}<p ${textAlignStyle}>${art.text.slice(pos)}</p>`;
            }
          }
        } else {
          html += `<p ${textAlignStyle}>${art.text}</p>`;
        }
      }
      if (isFloated && (pos === 'top' || pos === 'middle')) html += `<div class="clearfix"></div>`;
    }
    return html;
  }

  function loadForEdit(section, index) {
    let art = null;
    if (section === 'fullWidth') art = newspaperData.fullWidth;
    else if (section === 'colLeft' || section === 'colRight') art = newspaperData[section][index];
    else if (section === 'straight') art = { text: newspaperData.straightFromTheMan.text };
    else if (section === 'fakeAd') art = { text: newspaperData.fakeAd.text, colored: newspaperData.fakeAd.colored };
    else if (section === 'roundup') art = { text: newspaperData.roundup[index].text };
    else if (section === 'letters') art = { text: newspaperData.letters[index].text };
    else if (section === 'fight') art = { text: newspaperData.fight[index].text };
    else if (section === 'nextIssue') art = { text: newspaperData.nextIssue };
    else if (section === 'rubric') art = { text: newspaperData.fixedRubric };
    if (!art) return;
    document.getElementById('targetSection').value = section;
    document.getElementById('newTitle').value = art.title || '';
    document.getElementById('newText').value = art.text || '';
    document.getElementById('newKicker').value = art.kicker || '';
    document.getElementById('kickerSelect').value = '';
    document.getElementById('newByline').value = art.byline || '';
    document.getElementById('newImage').value = art.image || '';
    document.getElementById('imageFloat').value = art.imageFloat || 'none';
    document.getElementById('imagePosition').value = art.imagePosition || 'top';
    document.getElementById('imageCaption').value = art.imageCaption || '';
    document.getElementById('imageStyle').value = art.imageStyle || 'normal';
    if (section === 'fakeAd') {
      document.getElementById('coloredBg').checked = art.colored || false;
    } else {
      document.getElementById('coloredBg').checked = false;
    }
    if (section === 'fullWidth') {
      document.getElementById('fwTitleSize').value = art.fwTitleSize || '3rem';
      document.getElementById('fwTitleAlign').value = art.fwTitleAlign || 'center';
      document.getElementById('fwTextAlign').value = art.fwTextAlign || 'justify';
      document.getElementById('fwColumns').value = art.fwColumns || '2';
    } else {
      document.getElementById('fwTitleSize').value = '3rem';
      document.getElementById('fwTitleAlign').value = 'center';
      document.getElementById('fwTextAlign').value = 'justify';
      document.getElementById('fwColumns').value = '2';
    }
    toggleExtraSections();
    editing = { active: true, section: section, index: index };
    document.getElementById('editModeStatus').style.display = 'block';
    document.getElementById('cancelEditBtn').style.display = 'inline-block';
    document.getElementById('addContentBtn').innerHTML = '✏️ Aggiorna';
    document.getElementById('targetSection').disabled = (section !== 'fullWidth' && section !== 'colLeft' && section !== 'colRight');
  }

  function toggleExtraSections() {
    const section = document.getElementById('targetSection').value;
    const fullDiv = document.getElementById('fullwidthExtra');
    const fakeDiv = document.getElementById('fakeadExtra');
    fullDiv.style.display = (section === 'fullWidth') ? 'block' : 'none';
    fakeDiv.style.display = (section === 'fakeAd') ? 'block' : 'none';

  function addOrUpdate() {
    const section = document.getElementById('targetSection').value;
    const title = document.getElementById('newTitle').value;
    let text = document.getElementById('newText').value;
    let kicker = document.getElementById('newKicker').value;
    const ks = document.getElementById('kickerSelect').value;
    if (ks && !kicker) kicker = ks;
    const byline = document.getElementById('newByline').value;
    const image = document.getElementById('newImage').value;
    const imageFloat = document.getElementById('imageFloat').value;
    const imagePosition = document.getElementById('imagePosition').value;
    const imageCaption = document.getElementById('imageCaption').value;
    const imageStyle = document.getElementById('imageStyle').value;
    const colored = document.getElementById('coloredBg').checked;
    const fwTitleSize = document.getElementById('fwTitleSize').value;
    const fwTitleAlign = document.getElementById('fwTitleAlign').value;
    const fwTextAlign = document.getElementById('fwTextAlign').value;
    const fwColumns = document.getElementById('fwColumns').value;

    if (!text && section !== 'straight' && section !== 'fakeAd' && section !== 'nextIssue' && section !== 'rubric') {
      alert("Inserisci almeno il testo.");
      return;
    }

    if (editing.active) {
      if (section === 'fullWidth') {
        newspaperData.fullWidth = { type:'article', title, text, kicker, byline, image, imageFloat, imagePosition, imageCaption, imageStyle, fwTitleSize, fwTitleAlign, fwTextAlign, fwColumns };
      } else if (section === 'colLeft' || section === 'colRight') {
        newspaperData[section][editing.index] = { type:'article', title, text, kicker, byline, image, imageFloat, imagePosition, imageCaption, imageStyle };
      } else if (section === 'straight') {
        newspaperData.straightFromTheMan.text = text;
      } else if (section === 'fakeAd') {
        newspaperData.fakeAd.text = text;
        newspaperData.fakeAd.enabled = true;
        newspaperData.fakeAd.colored = colored;
      } else if (section === 'roundup') {
        newspaperData.roundup[editing.index] = { text: text };
      } else if (section === 'letters') {
        newspaperData.letters[editing.index] = { text: text };
      } else if (section === 'fight') {
        newspaperData.fight[editing.index] = { text: text };
      } else if (section === 'nextIssue') {
        newspaperData.nextIssue = text;
      } else if (section === 'rubric') {
        newspaperData.fixedRubric = text;
      }
      cancelEdit();
      saveAndRender();
      return;
    }

    switch(section) {
      case 'fullWidth':
        newspaperData.fullWidth = { type:'article', title, text, kicker, byline, image, imageFloat, imagePosition, imageCaption, imageStyle, fwTitleSize, fwTitleAlign, fwTextAlign, fwColumns };
        break;
      case 'colLeft':
        newspaperData.colLeft.push({ type:'article', title, text, kicker, byline, image, imageFloat, imagePosition, imageCaption, imageStyle });
        break;
      case 'colRight':
        newspaperData.colRight.push({ type:'article', title, text, kicker, byline, image, imageFloat, imagePosition, imageCaption, imageStyle });
        break;
      case 'straight':
        newspaperData.straightFromTheMan.text = text;
        break;
      case 'roundup':
        newspaperData.roundup.push({ text: text });
        break;
      case 'letters':
        newspaperData.letters.push({ text: text });
        break;
      case 'fight':
        newspaperData.fight.push({ text: text });
        break;
      case 'fakeAd':
        newspaperData.fakeAd = { text: text, enabled: true, colored: colored };
        break;
      case 'nextIssue':
        newspaperData.nextIssue = text;
        break;
      case 'rubric':
        newspaperData.fixedRubric = text;
        break;
    }
    cancelEdit();
    saveAndRender();
  }

  async function saveNewIssue() {
    let title = document.getElementById('issueTitle').value.trim();
    if (!title) title = `Uscita del ${new Date().toLocaleString()}`;
    const newspaperContent = getCurrentNewspaperData();
    const payload = { title: title, date: document.getElementById('data').value, content: newspaperContent };
    try {
      const res = await fetch('save_issue.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.success) { alert(`Uscita salvata con ID ${result.id}`); document.getElementById('issueTitle').value = ''; }
      else alert('Errore: ' + (result.error || 'Errore sconosciuto'));
    } catch(e) { alert('Errore di connessione al server: ' + e.message); }
  }

  async function updateCurrentIssue() {
    if (!currentIssueId) return;
    const title = document.getElementById('issueTitle').value.trim() || `Uscita aggiornata`;
    const newspaperContent = getCurrentNewspaperData();
    const payload = { id: currentIssueId, title: title, date: document.getElementById('data').value, content: newspaperContent };
    try {
      const res = await fetch('update_issue.php', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
      const result = await res.json();
      if (result.success) { alert('Uscita aggiornata con successo'); currentIssueId = null; document.getElementById('updateIssueBtn').style.display = 'none'; document.getElementById('issueTitle').value = ''; }
      else alert('Errore: ' + result.error);
    } catch(e) { alert('Errore di connessione: ' + e.message); }
  }

  async function loadIssueFromUrl() {
    const urlParams = new URLSearchParams(window.location.search);
    const editId = urlParams.get('edit');
    if (editId) {
      try {
        const res = await fetch(`load_issue.php?id=${editId}`);
        const data = await res.json();
        if (data.content) {
          newspaperData = data.content;
          document.getElementById('anno').value = newspaperData.header.anno;
          document.getElementById('numero').value = newspaperData.header.numero;
          document.getElementById('data').value = newspaperData.header.data;
          document.getElementById('titleColor').value = newspaperData.header.titleColor;
          document.getElementById('issueTitle').value = data.title || '';
          currentIssueId = data.id;
          document.getElementById('updateIssueBtn').style.display = 'inline-block';
          renderNewspaper(false);
          alert(`Uscita "${data.title}" caricata. Puoi modificarla e poi aggiornarla.`);
        } else alert('Uscita non trovata');
      } catch(e) { alert('Errore nel caricamento: ' + e.message); }
    }
  }

  function getCurrentNewspaperData() {
    newspaperData.header.anno = document.getElementById('anno').value;
    newspaperData.header.numero = document.getElementById('numero').value;
    newspaperData.header.data = document.getElementById('data').value;
    newspaperData.header.titleColor = document.getElementById('titleColor').value;
    return JSON.parse(JSON.stringify(newspaperData));
  }

  document.getElementById('addContentBtn').onclick = addOrUpdate;
  document.getElementById('cancelEditBtn').onclick = cancelEdit;
  document.getElementById('resetAllBtn').onclick = resetAll;
  document.getElementById('exportBtn').onclick = exportHTML;
  document.getElementById('printBtn').onclick = printPDF;
  document.getElementById('saveIssueBtn').onclick = saveNewIssue;
  document.getElementById('updateIssueBtn').onclick = updateCurrentIssue;
  document.getElementById('archiveBtn').onclick = () => { window.location.href = 'archivio.php'; };
  document.getElementById('targetSection').addEventListener('change', toggleExtraSections);
  ['anno','numero','data','titleColor'].forEach(id => document.getElementById(id).addEventListener('input', () => saveAndRender()));

  function loadFromStorage() {
    const saved = localStorage.getItem('undergroundObserver');
    if (saved) {
      try {
        const p = JSON.parse(saved);
        newspaperData = p;
        document.getElementById('anno').value = newspaperData.header.anno;
        document.getElementById('numero').value = newspaperData.header.numero;
        document.getElementById('data').value = newspaperData.header.data || getCurrentItalianDate();
        document.getElementById('titleColor').value = newspaperData.header.titleColor || "#8b1f1f";
      } catch(e) {}
    } else {
      initExampleData();
      document.getElementById('data').value = getCurrentItalianDate();
    }
    newspaperData.header.data = document.getElementById('data').value;
    renderNewspaper(false);
  }

  loadFromStorage();
  loadIssueFromUrl();
  toggleExtraSections();
</script>
</body>
</html>
